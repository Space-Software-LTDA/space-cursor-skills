<!doctype html>
<html lang="pt-BR">
<!-- SHELL do protótipo navegável (motor) — não editar no produto; melhoria vai para a skill via /skill-update.
     Nome, cor, tela de abertura e telas vêm de screens.js. -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo navegável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090C; --panel: #0C1015; --panel-2: #12171E; --line: #1E252E;
      --text: #F2F4F7; --muted: #8A94A3; --accent: #3B82F6; --accent-ink: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
    .app.no-side { grid-template-columns: 1fr; }
    .app.no-side aside { display: none; }

    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .brand b { font-size: 15px; }
    .brand b span { color: var(--accent); }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin: 14px 18px 6px; }
    .seg button { padding: 7px 0; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: 13px; }
    .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    nav { overflow-y: auto; padding: 6px 10px 24px; flex: 1; }
    nav h4 { margin: 16px 8px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    nav a { display: block; padding: 7px 10px; border-radius: 8px; color: #C9D0DA; text-decoration: none; font-size: 13px; }
    nav a:hover { background: var(--panel-2); color: var(--text); }
    nav a.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
    .foot { border-top: 1px solid var(--line); padding: 12px 18px; color: var(--muted); font-size: 12px; }
    .foot kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px Inter; }

    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .ttl { flex: 1; min-width: 0; }
    .ttl b, .ttl small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ttl small { color: var(--muted); font-size: 12px; }
    .ib { flex: none; height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #C9D0DA; }
    .ib:hover { color: var(--text); border-color: #2C3540; }
    .ib.on { border-color: var(--accent); color: var(--accent); }
    .ib:disabled { opacity: .35; cursor: default; }
    .ib.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .ib.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
    [hidden] { display: none !important; }
    .cta { position: absolute; right: 36px; bottom: 32px; z-index: 2; display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
    .cta:hover { filter: brightness(1.08); }
    .cta svg { width: 18px; height: 18px; }
    .ib svg { width: 16px; height: 16px; }

    .stage { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
    .frame { position: relative; flex: none; transform-origin: top left; }
    .frame iframe { display: block; border: 0; background: #0C1015; }
    .frame.desk { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; }
    .frame.phone { padding: 12px; background: #1A1F26; border-radius: 48px; box-shadow: 0 0 0 1px #2A313B, 0 24px 70px rgba(0,0,0,.6); }
    .frame.phone iframe { border-radius: 36px; }
    .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; pointer-events: none; transition: opacity .4s; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .app.side-open aside { display: flex; position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 10; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><b><span id="bName"></span> · Protótipo</b><small>Telas exportadas do canvas do produto</small></div>
    <div class="seg" id="seg">
      <button data-dev="d">Computador</button>
      <button data-dev="m">Celular</button>
    </div>
    <nav id="list"></nav>
    <div class="foot"><kbd>H</kbd> áreas clicáveis · <kbd>←</kbd><kbd>→</kbd> telas · <kbd>D</kbd> dispositivo · <kbd>Enter</kbd> iniciar<br>* ainda não existe no produto<br><span id="bVer"></span></div>
  </aside>
  <main>
    <header>
      <button class="ib" id="bSide" title="Mostrar/ocultar lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <button class="ib" id="bBack" title="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ib" id="bFwd" title="Avançar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="ttl"><b id="tTitle"></b><small id="tSub"></small></div>
      <button class="ib" id="bHs" title="Áreas clicáveis (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1M5.1 8l-2.9-.8M14 4.1 12 6M6 12l-1.9 2"/></svg>Clicáveis</button>
      <button class="ib" id="bHome" title="Manual da marca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></button>
      <button class="ib primary" id="bStart" hidden>Iniciar protótipo<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <a class="ib" id="bOpen" target="_blank" title="Abrir a tela sozinha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
    </header>
    <div class="stage" id="stage">
      <div class="frame" id="frame"><iframe id="ifr" title="Tela do protótipo"></iframe></div>
      <button class="cta" id="cta" hidden>Iniciar protótipo<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="hint" id="hint">Clique nos botões da tela para navegar · H mostra as áreas clicáveis</div>
    </div>
  </main>
</div>

<script src="screens.js"></script>
<script src="nav.js"></script>
<script>
  const CFG = window.PR_CONFIG || {};
  const SC = window.PR_INDEXAR(), G = window.PR_GROUPS;
  if (!Object.keys(SC).length) {
    document.body.innerHTML = "<p style=\"padding:40px;font:16px Inter,sans-serif;color:#F2F4F7\">Protótipo vazio: preencha <b>screens.js</b>, exporte as telas para <b>telas/</b> e rode <b>npm run prototipo:preparar</b>.</p>";
    throw new Error("screens.js vazio");
  }
  const $ = (id) => document.getElementById(id);
  const ifr = $("ifr"), frame = $("frame"), stage = $("stage");
  const isDoc = (id) => SC[id].device === "doc";
  const DEVS = ["d", "m"].filter((d) => Object.values(SC).some((s) => s.device === d));
  const homeOf = (d) => ((CFG.home && CFG.home[d]) || [])[0] || Object.values(SC).find((s) => s.device === d).id;
  const START = SC[CFG.inicio] ? CFG.inicio : homeOf(DEVS[0]);
  const hasLogin = DEVS.some((d) => CFG.home && CFG.home[d] && CFG.home[d][1] && CFG.home[d][1] !== CFG.home[d][0]);
  let cur = null, dev = DEVS[0], hs = false, back = [], fwd = [];

  // Marca do produto
  document.title = (CFG.produto ? CFG.produto + " · " : "") + "Protótipo navegável";
  $("bName").textContent = CFG.produto || "Produto";
  $("bVer").textContent = "Molde " + (window.PR_MOLDE_VERSAO || "");
  const hex = (v) => /^#[0-9a-f]{3,8}$/i.test(v || "");
  if (hex(CFG.destaque)) document.documentElement.style.setProperty("--accent", CFG.destaque);
  if (hex(CFG.textoNoDestaque)) document.documentElement.style.setProperty("--accent-ink", CFG.textoNoDestaque);
  if (DEVS.length < 2) $("seg").hidden = true;
  for (const b of $("seg").children) b.hidden = !DEVS.includes(b.dataset.dev);

  function renderList() {
    $("list").innerHTML = G.map((g) => {
      const items = g.screens.filter((s) => s[2] === "doc" || s[2] === dev);
      if (!items.length) return "";
      return `<h4>${g.name}</h4>` + items.map((s) =>
        `<a href="#/${s[0]}" class="${s[0] === cur ? "on" : ""}">${s[1]}</a>`).join("");
    }).join("");
    for (const b of $("seg").children) b.classList.toggle("on", b.dataset.dev === dev);
    const on = $("list").querySelector("a.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }

  function layout() {
    if (!cur) return;
    const s = SC[cur], pad = 40;
    const W = stage.clientWidth - pad, H = stage.clientHeight - pad;
    if (s.device === "m") {
      const fw = s.width + 24, fh = s.height + 24, k = Math.min(1, H / fh, W / fw);
      frame.className = "frame phone";
      ifr.style.width = s.width + "px";
      ifr.style.height = s.height + "px";
      frame.style.transform = `scale(${k})`;
      frame.style.width = fw + "px";
      frame.style.marginRight = (fw * k - fw) + "px";
    } else {
      const w = s.width, k = Math.min(1, W / w);
      frame.className = "frame desk";
      ifr.style.width = w + "px";
      ifr.style.height = Math.round(H / k) + "px";
      frame.style.transform = `scale(${k})`;
      frame.style.width = w + "px";
      frame.style.marginRight = (w * k - w) + "px";
    }
  }

  function subtitle(s) {
    if (s.device === "doc") return s.group;
    const size = s.device === "d" ? `Computador ${s.width}` : `Celular ${s.width}`;
    return s.group + " · " + size + (hasLogin ? (s.logged ? " · logado" : " · deslogado") : "");
  }

  function show(id, fromHistory) {
    if (id === "back") return goBack();
    if (!SC[id]) id = START;
    if (id === cur) return;
    if (cur && !fromHistory) { back.push(cur); fwd = []; }
    cur = id;
    const s = SC[id], doc = isDoc(id);
    if (!doc) dev = s.device;
    if (location.hash !== "#/" + id) history.replaceState(null, "", "#/" + id);
    ifr.src = "telas/" + id + ".html";
    $("tTitle").textContent = s.title;
    $("tSub").textContent = subtitle(s);
    $("bOpen").href = "telas/" + id + ".html";
    $("bBack").disabled = !back.length;
    $("bFwd").disabled = !fwd.length;
    $("bStart").hidden = !doc;
    $("bHs").hidden = doc;
    $("bHome").hidden = !SC[CFG.inicio];
    $("cta").hidden = !(doc && id === START);
    $("hint").hidden = doc;
    renderList();
    layout();
  }
  function goBack() { if (back.length) { fwd.push(cur); const p = back.pop(); cur = null; show(p, true); } }
  function goFwd() { if (fwd.length) { back.push(cur); const n = fwd.pop(); cur = null; show(n, true); } }
  function switchDevice(d) {
    if (!DEVS.includes(d)) return;
    if (isDoc(cur)) { dev = d; renderList(); return; }
    if (SC[cur].device === d) return;
    show(SC[cur].twin || homeOf(d));
  }
  function start() { show(homeOf(dev)); }
  function step(dir) {
    const ids = G.flatMap((g) => g.screens).filter((s) => s[2] === "doc" || s[2] === dev).map((s) => s[0]);
    const i = ids.indexOf(cur);
    show(ids[(i + dir + ids.length) % ids.length]);
  }
  function setHs(on) {
    hs = on;
    $("bHs").classList.toggle("on", hs);
    ifr.contentWindow && ifr.contentWindow.postMessage({ pr: "hotspots", on: hs }, "*");
  }

  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.pr === "go") show(d.id);
    if (d.pr === "ready") setHs(hs);
  });
  window.addEventListener("hashchange", () => {
    const id = location.hash.replace(/^#\/?/, "");
    if (id && id !== cur) show(id);
  });
  window.addEventListener("resize", layout);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea")) return;
    if (e.key === "h" || e.key === "H") setHs(!hs);
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
    if ((e.key === "d" || e.key === "D") && DEVS.length > 1) switchDevice(dev === "d" ? "m" : "d");
    if (e.key === "Enter" && isDoc(cur)) start();
  });
  $("seg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) switchDevice(b.dataset.dev); });
  $("bBack").onclick = goBack;
  $("bFwd").onclick = goFwd;
  $("bHs").onclick = () => setHs(!hs);
  $("bStart").onclick = start;
  $("cta").onclick = start;
  $("bHome").onclick = () => show(CFG.inicio);
  $("bSide").onclick = () => {
    const a = $("app");
    if (window.matchMedia && matchMedia("(max-width: 760px)").matches) a.classList.toggle("side-open");
    else a.classList.toggle("no-side");
    setTimeout(layout, 0);
  };
  $("list").addEventListener("click", () => $("app").classList.remove("side-open"));
  setTimeout(() => ($("hint").style.opacity = 0), 5000);

  show(location.hash.replace(/^#\/?/, "") || START, true);
</script>
</body>
</html>
